<html lang="en-GB">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bas3line Racket Finder</title>
<meta name="description" content="Three questions to find the right Bas3line padel racket.">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Racket Finder">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
<link rel="apple-touch-icon" href="images/icon-180.png">
<link rel="preload" href="fonts/Obviously-BlackItalic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Obviously-NarrowMedium.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Obviously";src:url("fonts/Obviously-BlackItalic.woff2") format("woff2"),url("fonts/Obviously-BlackItalic.woff") format("woff");font-weight:900;font-style:italic;font-display:swap}
@font-face{font-family:"Obviously";src:url("fonts/Obviously-Medium.woff2") format("woff2"),url("fonts/Obviously-Medium.woff") format("woff");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Obviously Narrow";src:url("fonts/Obviously-NarrowMedium.woff2") format("woff2"),url("fonts/Obviously-NarrowMedium.woff") format("woff");font-weight:500;font-style:normal;font-display:swap}

:root{
  --ink:#000000;
  --paper:#ffffff;
  --court:#ECF1F7;      /* matches the racket photo backgrounds */
  --navy:#211E69;
  --blue:#1778F1;
  --orange:#F94A14;
  --muted:#4B5163;
  --line:#D3DAE5;
  --head:"Obviously",Arial,Helvetica,sans-serif;
  --body:"Obviously Narrow",Arial,Helvetica,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-weight:500;font-size:1.1875rem;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}

/* Header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 20px}
.logo-btn{background:none;border:0;padding:6px 0;cursor:pointer}
.logo-btn img{height:22px;width:auto}
.link-btn{background:none;border:0;padding:10px 0 10px 12px;font-family:var(--head);font-weight:500;font-size:.95rem;color:var(--navy);cursor:pointer;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}

main{max-width:560px;margin:0 auto;padding:24px 20px 48px}

/* Type */
.h1{color:var(--navy);font-family:var(--head);font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.03em;line-height:.98;font-size:clamp(2.3rem,10.5vw,3.3rem);margin:0 0 16px}
.h2{color:var(--navy);font-family:var(--head);font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.03em;line-height:1.02;font-size:clamp(1.65rem,7.4vw,2.2rem);margin:0 0 20px}
.h3{font-family:var(--head);font-weight:500;letter-spacing:.03em;font-size:1.05rem;margin:0 0 10px}
.lead{font-size:1.3rem;margin:0 0 28px;max-width:30ch}
.muted{color:var(--muted)}
p{margin:0 0 16px}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:60px;padding:14px 20px;border-radius:10px;border:2px solid var(--navy);font-family:var(--head);font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.03em;font-size:1.125rem;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:active{background:#14124a}
.btn-ghost{background:var(--paper);color:var(--navy);font-size:.95rem}
.stack{display:grid;gap:12px}

/* Home: navy cover screen built on the design agent's artwork */
body.is-home{background:var(--navy)}
body.is-home::before{background:#18164E}
body.is-home .bar{display:none}
body.is-home main{max-width:none;padding:0}
.home{position:relative;overflow:hidden;max-width:560px;margin:0 auto;background:var(--navy);color:#fff;display:flex;flex-direction:column;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.home-img{position:absolute;left:0;top:0;width:100%;height:auto}
.home-shade{display:none;position:absolute;left:0;top:0;width:100%;aspect-ratio:780/1040}
.home-in{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 28px 36px}
.home-title{font-family:var(--head);font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.03em;line-height:.92;font-size:clamp(3rem,16.4vw,4.4rem);margin:0 0 22px;color:#fff}
.home-lead{border-left:4px solid var(--orange);padding:2px 0 2px 14px;font-size:1.0625rem;line-height:1.35;color:#E9E9EE;margin:0 0 30px}
.btn-home{font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.03em}
.btn-light{background:#fff;border-color:#fff;color:var(--navy);gap:14px;font-size:1.125rem}
.btn-light:active{background:#E9E9EE}
.btn-outline-light{background:transparent;border-color:#fff;color:#fff;font-size:.95rem}
.home :focus-visible{outline-color:#fff}
@media (max-height:720px){
  .home-shade{display:block;background:linear-gradient(180deg,rgba(33,30,105,0) 28%,rgba(33,30,105,.72) 50%,#211E69 68%)}
}

/* Questions */
.progress{display:flex;gap:6px;margin:0 0 10px}
.progress span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress span.on{background:var(--navy)}
.progress span.now{background:var(--orange)}
.h-q{text-transform:none;letter-spacing:.01em;line-height:1.08}
.step{font-family:var(--head);font-weight:500;font-size:.95rem;letter-spacing:.03em;color:var(--muted);margin:0 0 18px}
.options{display:grid;gap:12px;margin:0 0 28px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;text-align:left;padding:16px 18px;background:var(--paper);border:2px solid var(--line);border-radius:12px;cursor:pointer;font-family:var(--body);font-size:1.3rem;line-height:1.25;color:var(--ink);transition:border-color .12s,background-color .12s}
.opt::before{content:"";flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);background:var(--paper)}
.opt:hover{border-color:var(--navy)}
.opt.picked{border-color:var(--navy);background:var(--court)}
.opt.picked::before{border-color:var(--navy);background:var(--navy);box-shadow:inset 0 0 0 4px var(--court)}
.back{background:none;border:0;padding:12px 0;font-family:var(--head);font-weight:500;font-size:1rem;color:var(--navy);cursor:pointer;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}

/* Racket showcase */
.based{margin:0 0 14px;font-size:1.05rem}
.panel{position:relative;background:var(--court);border-radius:14px;display:flex;justify-content:center;padding:10px 0 0;margin:0 0 20px;overflow:hidden}
.panel img{height:min(54vh,460px);width:auto}
.tag{position:absolute;z-index:1;top:14px;left:14px;background:var(--navy);color:#fff;font-family:var(--head);font-weight:500;letter-spacing:.03em;font-size:.9rem;padding:7px 12px;border-radius:999px}
.name-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 16px}
.name{color:var(--navy);font-family:var(--head);font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.03em;line-height:.95;font-size:clamp(2.3rem,11vw,3.4rem);margin:0}
.price{font-family:var(--head);font-weight:500;font-size:1.5rem;white-space:nowrap}
.why{font-size:1.3rem;line-height:1.35;border-left:4px solid var(--orange);padding:2px 0 2px 14px;margin:0 0 24px}
.specs{margin:0 0 20px;border-top:1px solid var(--line)}
.specs div{display:grid;grid-template-columns:7.2rem 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.specs dt{color:var(--muted)}
.specs dd{margin:0}
.colour{background:var(--court);border-radius:10px;padding:12px 14px;margin:0 0 20px}
.about{margin:0 0 20px}
.shop{display:inline-block;padding:10px 0;font-family:var(--head);font-weight:500;font-size:1rem;text-underline-offset:4px;text-decoration-thickness:2px}
.common{font-size:1rem;color:var(--muted);margin:8px 0 28px}

/* Alternative */
.alt{margin:8px 0 28px;padding-top:24px;border-top:4px solid var(--ink)}
.alt-card{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;width:100%;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;margin:0}
.alt-card:hover{border-color:var(--navy)}
.alt-thumb{background:var(--court);border-radius:8px;padding:6px 6px 0;display:flex;justify-content:center}
.alt-thumb img{height:120px;width:auto}
.alt-name{color:var(--navy);font-family:var(--head);font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.03em;font-size:1.6rem;line-height:1;margin:0 0 6px}
.alt-meta{font-family:var(--head);font-weight:500;font-size:.95rem;color:var(--muted);margin:0 0 8px}
.alt-go{font-family:var(--head);font-weight:500;font-size:.95rem;color:var(--navy);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}

/* Range grid */
.group{margin:0 0 30px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{display:block;width:100%;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px;cursor:pointer}
.card:hover{border-color:var(--navy)}
.card .thumb{background:var(--court);border-radius:8px;padding:8px 8px 0;display:flex;justify-content:center;margin:0 0 10px}
.card .thumb img{height:170px;width:auto}
.card-name{color:var(--navy);font-family:var(--head);font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.03em;font-size:1.25rem;line-height:1;margin:0 0 4px 4px}
.card-meta{font-size:1rem;color:var(--muted);margin:0 0 4px 4px}

/* Safety */
.safety{border-left:4px solid var(--orange);padding:2px 0 2px 16px;font-size:1.3rem;margin:0 0 28px}

/* One moment of motion: the recommendation arriving */
@media (prefers-reduced-motion:no-preference){
  .reveal .panel img{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
}
@media (min-width:600px){
  main{padding-top:36px}
}
</style>
</head>

   "altWhy": "Balanced alternative"
  },
  "Advanced|Wrist": {
   "rec": "Orion",
   "why": "Lightweight, head-light balance",
   "alt": "Alpha Control",
   "altWhy": "Alternative head-light option"
  },
  "Advanced|Elbow": {
   "rec": "Orion",
   "why": "Lightweight and control-focused",
   "alt": "Vega",
   "altWhy": "Slightly heavier, more attacking option"
  },
  "Advanced|Shoulder": {
   "rec": "Vega",
   "why": "Neutral balance for advanced players",
   "alt": "Alpha Control",
   "altWhy": "Alternative head-light option"
  }
 }
};

/* ============================================================
   APP
   ============================================================ */
const app = document.getElementById("app");
const idOf = name => name.trim().toLowerCase().replace(/\s+/g, "-");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const img = (id, cls = "", lazy = false) =>
  `<img class="${cls}" src="images/rackets/${id}.webp" alt="${esc(RACKETS[id].name)} padel racket" width="640" height="949"${lazy ? ' loading="lazy"' : ""}>`;

function go(state) { history.pushState(state, ""); render(state); }
window.addEventListener("popstate", e => render(e.state || { view: "home" }));

document.addEventListener("click", e => {
  const t = e.target.closest("[data-go]");
  if (!t) return;
  const v = t.dataset.go;
  if (v === "home") go({ view: "home" });
  else if (v === "range") go({ view: "range" });
  else if (v === "start") go({ view: "q", step: 1, answers: {} });
  else if (v === "back") history.back();
  else if (v === "racket") go({ view: "racket", id: t.dataset.id });
  else if (v === "alt") {
    const row = rowFor((history.state || {}).answers);
    if (row) go({ view: "racket", id: idOf(row.alt), why: row.altWhy, tag: "Alternative" });
  }
});

const themeMeta = document.querySelector('meta[name="theme-color"]');
function render(s) {
  const isHome = !s.view || s.view === "home";
  document.body.classList.toggle("is-home", isHome);
  themeMeta.setAttribute("content", isHome ? "#18164E" : "#ffffff");
  app.classList.remove("reveal");
  if (s.view === "q") app.innerHTML = question(s);
  else if (s.view === "result") { app.innerHTML = result(s); app.classList.add("reveal"); }
  else if (s.view === "safety") app.innerHTML = safety();
  else if (s.view === "range") app.innerHTML = range();
  else if (s.view === "racket") app.innerHTML = racketPage(s.id, s.why, s.tag);
  else app.innerHTML = home();
  window.scrollTo(0, 0);
  const h = app.querySelector("h1,h2");
  if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
  if (s.view === "q") bindOptions(s);
}

function home() {
  return `
    <section class="home">
      <img class="home-img" src="images/home-bg-2x.webp" srcset="images/home-bg-2x.webp 2x, images/home-bg-3x.webp 3x" alt="Bas3line logo above a close-up of the Juno padel racket" width="780" height="1040">
      <div class="home-shade" aria-hidden="true"></div>
      <div class="home-in">
        <h1 class="home-title">Find<br>your<br>racket</h1>
        <p class="home-lead">Answer three quick questions and we’ll match you to the Bas3line racket that suits your game.</p>
        <div class="stack">
          <button class="btn btn-home btn-light" type="button" data-go="start">Start
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F94A14" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
          </button>
          <button class="btn btn-home btn-outline-light" type="button" data-go="range">Browse all rackets</button>
        </div>
      </div>
    </section>`;
}

function question(s) {
  const a = s.answers;
  let q, opts;
  if (s.step === 1) { q = Q_INJURY.text; opts = Q_INJURY.options; }
  else if (s.step === 2) { q = Q_LEVEL.text; opts = Q_LEVEL.options.map(o => ({ value: o, label: o })); }
  else { const src = a.injury === "no" ? Q_STYLE : Q_TYPE; q = src.text; opts = src.options.map(o => ({ value: o, label: o })); }
  const bars = [1, 2, 3].map(n => `<span class="${n < s.step ? "on" : n === s.step ? "now" : ""}"></span>`).join("");
  return `
    <div class="progress" aria-hidden="true">${bars}</div>
    <p class="step">Question ${s.step} of 3</p>
    <h1 class="h2 h-q">${esc(q)}</h1>
    <div class="options" role="group" aria-label="${esc(q)}">
      ${opts.map(o => `<button class="opt" type="button" data-value="${esc(o.value)}">${esc(o.label)}</button>`).join("")}
    </div>
    <button class="back" type="button" data-go="back">Back</button>`;
}

function bindOptions(s) {
  app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    app.querySelectorAll(".opt").forEach(x => x.classList.remove("picked"));
    b.classList.add("picked");
    const v = b.dataset.value;
    const answers = { ...s.answers };
    let next;
    if (s.step === 1) {
      answers.injury = v;
      next = v === "stopped" ? { view: "safety" } : { view: "q", step: 2, answers };
    } else if (s.step === 2) {
      answers.level = v;
      next = { view: "q", step: 3, answers };
    } else {
      answers.third = v;
      next = { view: "result", answers };
    }
    const delay = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 160;
    setTimeout(() => go(next), delay);
  }));
}

function specList(id) {
  const sp = RACKETS[id].specs;
  return `<dl class="specs">${Object.keys(sp).map(k => `<div><dt>${k}</dt><dd>${esc(sp[k])}</dd></div>`).join("")}</dl>`;
}

function nameRow(id) {
  const r = RACKETS[id];
  return `<div class="name-row"><h1 class="name">${esc(r.name)}</h1><span class="price">${r.price}</span></div>`;
}
function panel(id, tag) {
  return `<div class="panel">${tag ? `<span class="tag">${tag}</span>` : ""}${img(id)}</div>`;
}

function details(id, withAbout) {
  const r = RACKETS[id];
  return `
    ${specList(id)}
    ${r.colour ? `<p class="colour">${r.colour}</p>` : ""}
    ${withAbout ? `<p class="about">${esc(r.about)}</p>` : ""}
    <a class="shop" href="${r.url}" target="_blank" rel="noopener">View the ${esc(r.name)} on bas3line.com</a>`;
}

function rowFor(a) {
  if (!a || !a.injury) return null;
  return (a.injury === "no" ? MATRIX.A : MATRIX.B)[`${a.level}|${a.third}`] || null;
}

function result(s) {
  const a = s.answers;
  const row = rowFor(a);
  if (!row) return home();
  const id = idOf(row.rec), altId = idOf(row.alt), alt = RACKETS[altId];
  const based = a.injury === "no"
    ? `No arm injury, ${a.level.toLowerCase()}, ${a.third.toLowerCase()} player`
    : `${a.third} pain, ${a.level.toLowerCase()} player`;
  return `
    <p class="based muted">${esc(based)}</p>
    ${nameRow(id)}
    <p class="why">${esc(row.why)}</p>
    ${panel(id, "Recommended")}
    ${details(id, true)}
    <section class="alt" aria-labelledby="alt-h">
      <h2 class="h2" id="alt-h">Alternative</h2>
      <p class="why">${esc(row.altWhy)}</p>
      <button class="alt-card" type="button" data-go="alt">
        <span class="alt-thumb">${img(altId)}</span>
        <span>
          <span class="alt-name" style="display:block">${esc(alt.name)}</span>
          <span class="alt-meta" style="display:block">${alt.price}, ${alt.specs.Weight}, ${alt.specs.Balance.toLowerCase()}</span>
          <span class="alt-go">See the ${esc(alt.name)}</span>
        </span>
      </button>
    </section>
    <div class="stack">
      <button class="btn btn-primary" type="button" data-go="start">Start again</button>
      <button class="btn btn-ghost" type="button" data-go="range">Browse all rackets</button>
    </div>`;
}

function racketPage(id, why, tag) {
  if (!RACKETS[id]) return range();
  return `
    ${nameRow(id)}
    ${why ? `<p class="why">${esc(why)}</p>` : ""}
    ${panel(id, tag)}
    ${details(id, true)}
    <div class="stack">
      <button class="btn btn-primary" type="button" data-go="back">Back</button>
      <button class="btn btn-ghost" type="button" data-go="start">Start the questions</button>
    </div>`;
}

function range() {
  return `
    <h1 class="h1">The range</h1>
    <div class="grid group">
          ${ORDER.map(id => {
            const r = RACKETS[id];
            return `<button class="card" type="button" data-go="racket" data-id="${id}">
              <span class="thumb">${img(id, "", true)}</span>
              <span class="card-name" style="display:block">${esc(r.name)}</span>
              <span class="card-meta" style="display:block">${r.price}, ${r.specs.Weight}</span>
              <span class="card-meta" style="display:block">${r.specs.Balance}</span>
            </button>`;
          }).join("")}
    </div>
    <div class="stack">
      <button class="btn btn-primary" type="button" data-go="start">Start the questions</button>
    </div>`;
}

function safety() {
  return `
    <h1 class="h2">Get it treated first</h1>
    <p class="safety">${esc(SAFETY_MESSAGE)}</p>
    <div class="stack">
      <button class="btn btn-primary" type="button" data-go="start">Start again</button>
      <button class="btn btn-ghost" type="button" data-go="range">Browse all rackets</button>
    </div>`;
}

history.replaceState({ view: "home" }, "");
render({ view: "home" });
</script>
</body>
</html>
